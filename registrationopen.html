<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Open Now</title>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --c: #ff1a1a;
      --c2: #cc0000;
      --orange: #ff6600;
      --bg: #0d0303;
      --surface: #160606;
      --surface-2: #1a0808;
      --text: #f8eaea;
      --muted: rgba(240, 200, 200, 0.45);
      --border: rgba(255, 26, 26, 0.22);
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Exo 2', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--sans);
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at center, rgba(255, 26, 26, 0.08), transparent 45%),
        linear-gradient(180deg, #120404 0%, #0d0303 100%);
    }

    /* Animated grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 26, 26, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 26, 26, 0.06) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    /* Scanline sweep */
    .bg-scan {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        transparent 0%,
        transparent 22%,
        rgba(255, 26, 26, 0.025) 24%,
        transparent 26%,
        transparent 48%,
        rgba(255, 26, 26, 0.02) 50%,
        transparent 52%,
        transparent 74%,
        rgba(255, 26, 26, 0.025) 76%,
        transparent 78%
      );
      animation: scanMove 10s ease-in-out infinite alternate;
    }

    @keyframes scanMove {
      from { transform: translateY(-8%); opacity: 0.6; }
      to   { transform: translateY(8%); opacity: 1; }
    }

    /* Glow vignette */
    .bg-glow {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(
        ellipse 60% 70% at 50% 50%,
        rgba(255, 26, 26, 0.08) 0%,
        transparent 70%
      );
      animation: glowPulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { opacity: 0.55; }
      to   { opacity: 1; }
    }

    /* Main frame */
    .banner {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 28px;
      overflow: hidden;
    }

    .panel {
      position: relative;
      width: min(1200px, 96%);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 8px;
      background:
        linear-gradient(180deg, rgba(255, 26, 26, 0.04), rgba(255, 26, 26, 0.015)),
        rgba(13, 3, 3, 0.78);
      border: 1px solid var(--border);
      clip-path: polygon(18px 0%, 100% 0%, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0% 100%, 0% 18px);
      box-shadow:
        inset 0 0 0 1px rgba(255, 26, 26, 0.04),
        0 0 28px rgba(255, 26, 26, 0.08);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--c), transparent);
      box-shadow: 0 0 12px rgba(255, 26, 26, 0.5);
      opacity: 0.8;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255,26,26,0.03) 50%, transparent 100%);
      animation: shimmer 4s linear infinite;
      mix-blend-mode: screen;
    }

    @keyframes shimmer {
      from { transform: translateX(-25%); }
      to   { transform: translateX(25%); }
    }

    /* Corner accents */
    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: var(--c);
      border-style: solid;
      opacity: 0.55;
      z-index: 3;
    }

    .corner-tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; }

    /* Eyebrow */
    .eyebrow {
      font-family: var(--mono);
      font-size: clamp(0.55rem, 1vw, 0.72rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 4;
      text-align: center;
      animation: rise 0.7s ease both;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--orange);
      box-shadow: 0 0 6px var(--orange);
    }

    /* Main blinking headline */
    .headline {
      font-family: var(--sans);
      font-size: clamp(2rem, 5vw, 4.8rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--text);
      text-align: center;
      position: relative;
      z-index: 4;
      animation: rise 0.8s 0.15s ease both;
      padding: 0 20px;
    }

    .headline .accent {
      color: var(--c);
      text-shadow:
        0 0 8px rgba(255, 26, 26, 0.8),
        0 0 18px rgba(255, 26, 26, 0.65),
        0 0 34px rgba(255, 26, 26, 0.28);
      animation: blinkGlow 1.15s infinite;
    }

    /* Blinking effect */
    @keyframes blinkGlow {
      0%, 100% {
        opacity: 1;
        text-shadow:
          0 0 8px rgba(255, 26, 26, 0.95),
          0 0 18px rgba(255, 26, 26, 0.7),
          0 0 34px rgba(255, 26, 26, 0.35);
        filter: brightness(1);
      }
      15% {
        opacity: 0.45;
        text-shadow:
          0 0 3px rgba(255, 26, 26, 0.4),
          0 0 8px rgba(255, 26, 26, 0.2);
        filter: brightness(0.85);
      }
      30% {
        opacity: 1;
      }
      45% {
        opacity: 0.65;
      }
      60% {
        opacity: 1;
      }
      75% {
        opacity: 0.55;
      }
    }

    /* Subtext */
    .subtitle {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: clamp(0.62rem, 1.1vw, 0.82rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      z-index: 4;
      animation: rise 0.8s 0.28s ease both;
      padding: 0 16px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .banner {
        height: 260px;
      }

      .headline {
        font-size: clamp(1.65rem, 6vw, 3.4rem);
        letter-spacing: 0.09em;
      }

      .subtitle {
        letter-spacing: 0.16em;
        padding: 0 12px;
      }
    }

    @media (max-width: 600px) {
      .banner {
        height: 280px;
        padding: 14px;
      }

      .eyebrow::before,
      .eyebrow::after {
        display: none;
      }

      .headline {
        font-size: clamp(1.4rem, 7vw, 2.4rem);
      }

      .subtitle {
        font-size: 0.58rem;
        letter-spacing: 0.14em;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-scan"></div>
  <div class="bg-glow"></div>

  <div class="banner">
    <div class="panel">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="eyebrow">CGC × Microsoft Agent-Thon 2026</div>

      <div class="headline">
        <span class="accent">Registration Open Now</span>
      </div>

      <div class="subtitle">
        Form your team · Build AI agents · Join the challenge
      </div>
    </div>
  </div>
</body>
</html>
